<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="google40f7017eb8197edc" />
    <meta
      name="description"
      content="4가지 분석 전략으로 완성하는 스마트 로또! 자주 나온 번호, 최근 안 나온 번호 등 데이터를 다각도로 분석하여, 여러분께 전략적 선택의 기회와 색다른 재미를 제공합니다."
    />
    <meta
      name="keywords"
      content="로또, 로또번호, 로또 번호, 로또생성기, 로또 생성기, 로또당첨번호, 로또분석, 무료로또, 1등예상번호, Lotto, lotto, 로또명당, 로또 당첨, 번호추첨, 번호 추첨, 로또번호추첨"
    />

    <title>로또 당첨 제조기</title>
    <link rel="canonical" href="https://rlaskarb20.mycafe24.com/lotto/" />
    <link rel="icon" type="image/png" href="./data/loto.png" />
    <link rel="apple-touch-icon" href="./data/loto.png" />
    <link rel="manifest" href="./data/mainImg.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/lotto.css" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>🎰 로또 당첨 제조기</h1>
      </div>

      <div class="lotto-section">
        <div class="generator-box">
          <h2>🎯 1등 당첨 번호 받기</h2>

          <div class="number-display" id="lottoNumbers">
            <div class="lotto-ball ball-1">?</div>
            <div class="lotto-ball ball-2">?</div>
            <div class="lotto-ball ball-3">?</div>
            <div class="lotto-ball ball-4">?</div>
            <div class="lotto-ball ball-5">?</div>
            <div class="lotto-ball ball-6">?</div>
          </div>
          <div class="number-btn">
            <button class="btn" onclick="generateStrategyNumbers('hot')">
              🔥 많이 나온 번호
            </button>

            <button class="btn" onclick="generateStrategyNumbers('cold')">
              ❄️ 적게 나온 번호
            </button>

            <button class="btn" onclick="generateStrategyNumbers('overdue')">
              ⏰ 안 나온 번호
            </button>

            <button class="btn" onclick="generateStrategyNumbers('random')">
              🍀 랜덤 번호
            </button>
          </div>
        </div>

        <div class="stats-box">
          <h2>📈 실시간 당첨 정보</h2>
          <div class="latest-draw-container">
            <h3 id="drawRound">로딩 중...</h3>
            <div id="latestNumbers" class="number-api"></div>
          </div>
          <hr />
          <h2>📊누적 통계 정보</h2>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-number" id="totalDraws">0</div>
              <div class="stat-label">총 데이터 입력 횟수</div>
            </div>
            <div class="stat-item">
              <div class="stat-number" id="mostFrequent">-</div>
              <div class="stat-label">최다 출현 번호</div>
            </div>
            <div class="stat-item">
              <div class="stat-number" id="leastFrequent">-</div>
              <div class="stat-label">최소 출현 번호</div>
            </div>
          </div>
        </div>
      </div>

      <h2>🎯 번호 통계 데이터</h2>
      <div class="chart-container">
        <div id="advancedAnalysis">
          <div class="analysis-grid">
            <div class="analysis-item">
              <h3>🔥그동안 많이 나온 번호</h3>
              <div id="hotNumbers" class="number-list"></div>
            </div>
            <div class="analysis-item">
              <h3>❄️그동안 적게 나온 번호</h3>
              <div id="coldNumbers" class="number-list"></div>
            </div>
            <div class="analysis-item">
              <h3>⏰ 최근 10회 동안 안 나온 번호</h3>
              <div id="overdueNumbers" class="number-list"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="analysis-section">
        <h2>📊 번호별 출현 빈도 분석</h2>

        <div class="chart-container">
          <div id="frequencyChart"></div>
        </div>
      </div>
    </div>

    <div id="strategyModal" class="modal-overlay">
      <div class="modal-content">
        <h2 id="modalTitle">✨ 황금 조합 분석 완료!</h2>
        <p id="modalMessage"></p>
        <button class="btn1" onclick="closeModal()">확인</button>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/api.js"></script>
  </body>
</html>
